# Publishes the app as a GitLab Pages site on every push to the default branch.
# There is no build step. Pages serves only public/, so the job copies the app
# files there. Keep this list in step with ASSETS in sw.js.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir public
    - cp -r index.html manifest.webmanifest sw.js css js art icons content public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
